[mypy]
python_version        = 3.14
strict                = True
warn_unused_ignores   = True
allow_redefinition    = True
mypy_path             = src

[mypy-torch.*]
implicit_reexport      = True
ignore_missing_imports = True

[mypy-pefile.*]
implicit_reexport      = True
ignore_missing_imports = True

[mypy-signify.*]
implicit_reexport      = True
ignore_missing_imports = True

[mypy-sklearn.*]
implicit_reexport      = True
ignore_missing_imports = True

[mypy-pandas.*]
implicit_reexport      = True
ignore_missing_imports = True

[mypy-polars.*]
implicit_reexport      = True
ignore_missing_imports = True

[mypy-hypothesis.*]
implicit_reexport      = True
ignore_missing_imports = True

[mypy-tests.reference.*]
ignore_errors = True

[mypy-provexp.featuresets.ember2024.features]
disallow_untyped_defs  = False
disallow_untyped_calls = False
disallow_any_generics  = False
