[mypy]
python_version        = 3.14
strict                = True
warn_unused_ignores   = True
allow_redefinition    = True
mypy_path             = src

[mypy-torch.*]
implicit_reexport      = True
ignore_missing_imports = True

[mypy-pefile.*]
implicit_reexport      = True
ignore_missing_imports = True

[mypy-signify.*]
implicit_reexport      = True
ignore_missing_imports = True

[mypy-scipy.*]
implicit_reexport      = True
ignore_missing_imports = True

[mypy-sklearn.*]
implicit_reexport      = True
ignore_missing_imports = True

[mypy-pandas.*]
implicit_reexport      = True
ignore_missing_imports = True

[mypy-polars.*]
implicit_reexport      = True
ignore_missing_imports = True

[mypy-hypothesis.*]
implicit_reexport      = True
ignore_missing_imports = True

[mypy-tests.reference.*]
ignore_errors = True

# Derived from thrember, which is not type-annotated (see the NOTICE in its directory).
[mypy-provexp.featuresets.ember2024.features]
ignore_errors = True

[mypy-numba.*]
implicit_reexport      = True
ignore_missing_imports = True

[mypy-lightgbm.*]
implicit_reexport      = True
ignore_missing_imports = True

[mypy-tlsh.*]
implicit_reexport      = True
ignore_missing_imports = True

[mypy-shap.*]
implicit_reexport      = True
ignore_missing_imports = True
