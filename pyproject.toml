[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "provexp"
version = "0.1.0"
description = "Transferring explanations between the problem-space and the feature-space."
requires-python = ">=3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"provexp.featuresets.ember2024" = ["pefile_warnings.txt", "LICENSE", "NOTICE"]
